[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
loglevel=info

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:xvfb]
command=/usr/local/bin/svc.sh xvfb
user=%(ENV_APP_USER)s
environment=HOME="%(ENV_APP_HOME)s",USER="%(ENV_APP_USER)s"
priority=10
autorestart=true
startsecs=2
stopsignal=TERM
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:fluxbox]
command=/usr/local/bin/svc.sh fluxbox
user=%(ENV_APP_USER)s
environment=HOME="%(ENV_APP_HOME)s",USER="%(ENV_APP_USER)s"
priority=20
autorestart=true
startsecs=3
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:x11vnc]
command=/usr/local/bin/svc.sh x11vnc
user=%(ENV_APP_USER)s
environment=HOME="%(ENV_APP_HOME)s",USER="%(ENV_APP_USER)s"
priority=30
autorestart=true
startsecs=3
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:websockify]
command=/usr/local/bin/svc.sh websockify
user=%(ENV_APP_USER)s
environment=HOME="%(ENV_APP_HOME)s",USER="%(ENV_APP_USER)s"
priority=35
autorestart=true
startsecs=2
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:brave]
command=/usr/local/bin/svc.sh brave
user=%(ENV_APP_USER)s
environment=HOME="%(ENV_APP_HOME)s",USER="%(ENV_APP_USER)s",XDG_RUNTIME_DIR="/run/clouddesk"
priority=50
autorestart=true
startsecs=5
startretries=10
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:memguard]
command=/usr/bin/python3 -u /usr/local/bin/memguard.py
user=%(ENV_APP_USER)s
environment=HOME="%(ENV_APP_HOME)s",DISPLAY=":0"
priority=60
autorestart=true
startsecs=3
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:statesync]
command=/usr/local/bin/statesync.sh loop
user=%(ENV_APP_USER)s
environment=HOME="%(ENV_APP_HOME)s"
priority=70
autorestart=unexpected
exitcodes=0
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
