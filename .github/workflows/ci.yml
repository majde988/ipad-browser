name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint (Dockerfile / shell / python / ES5 guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          ignore: DL3008,DL3013,DL4006
          failure-threshold: error

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S error scripts/*.sh

      - name: python syntax
        run: python3 -m py_compile scripts/memguard.py

      - name: ES5 guard (iOS 9 compatibility)
        run: |
          if grep -nE '=>|\blet\b|\bconst\b|fetch\(|`' web/control_panel.html; then
            echo "::error::Non-ES5 syntax found in control_panel.html"; exit 1
          fi
          echo "ES5 check passed"

  build:
    name: Build & smoke test (512 MB)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: clouddesk:ci
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container (Render Free limits)
        run: docker run -d --name clouddesk --memory=512m -e MEM_LIMIT_MB=512 -p 10000:10000 clouddesk:ci

      - name: Wait for noVNC
        run: |
          for i in $(seq 1 45); do
            curl -sf http://localhost:10000/vnc.html >/dev/null && exit 0
            sleep 2
          done
          echo "::error::noVNC did not come up within 90s"; exit 1

      - name: Assert control panel injected
        run: curl -sf http://localhost:10000/vnc_auto.html | grep -q 'cd-panel'

      - name: Assert MemGuard API
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:10000/api/mem.json | grep -q '"pct"' && exit 0
            sleep 2
          done
          echo "::error::/api/mem.json not published"; exit 1

      - name: Container logs
        if: always()
        run: docker logs clouddesk 2>&1 | tail -n 200
